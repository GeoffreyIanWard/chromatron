name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that is not an error is a warning that accumulates.
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
# `@v2` can point at different code tomorrow with no commit in this repo and no
# review, which is a supply-chain hole in something that runs with a token on
# every push. The trailing comment records which tag the SHA came from so a
# deliberate upgrade stays legible.
#
# The cache step is `continue-on-error` everywhere it appears. Caching is an
# optimisation and must never be able to fail a build — the first three runs of
# this workflow all lost jobs to codeload returning 429/503 while fetching the
# cache action, on a docs-only change that had nothing to cache. A red X that
# means nothing is worse than no signal at all, because it teaches everyone to
# ignore the ones that do mean something.

jobs:
  # The firewall runs on its own, first, and does not wait for the build matrix.
  # It is the cheapest check in the repo and the most expensive violation to
  # discover late. It deliberately has no cache step: it builds one small test
  # crate in about a minute, so a cache would save little and can only add a
  # failure mode.
  firewall:
    name: dependency firewall
    runs-on: ubuntu-latest
    # Every job is bounded. GitHub's default is six hours, which is not a
    # timeout, it is a licence to burn a runner all afternoon — see the
    # apt-get hang recorded on the Vulkan step below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup show # honours rust-toolchain.toml
      - run: cargo test -p ci-checks --test firewall

  check:
    name: fmt, clippy, test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true

      # lavapipe: Mesa's Vulkan software rasterizer. The renderer's correctness
      # tests — pixels, draw-call counts, validation errors — need an adapter but
      # not a fast one, and Linux runners have no GPU. Frame *rate* from a
      # software rasterizer is meaningless and is not gated here; see the M1
      # milestone for how that is measured instead.
      # This step has failed two different ways, and both are recorded here
      # because the fix for each is a different line.
      #
      # **It hung for over two hours** with no output: apt was blocking on the
      # runner's own unattended-upgrade holding the dpkg lock, and GitHub's
      # default six-hour job timeout did nothing about it. Hence
      # `timeout-minutes`, `DEBIAN_FRONTEND=noninteractive`, and
      # `DPkg::Lock::Timeout`.
      #
      # **Then it timed out at five minutes, silently.** `-qq` suppresses all
      # output, so a stall was indistinguishable from slow progress and there
      # was nothing in the log to diagnose. Three changes:
      #
      # 1. `-q` rather than `-qq`, so progress is visible and a future stall
      #    says where it stopped.
      # 2. `apt-get install` is tried *before* `apt-get update`. The runner
      #    image ships package lists only days old, `update` refreshes a dozen
      #    repositories this build does not use, and it is the slow half. The
      #    update path is still there as a fallback for when the lists really
      #    are stale.
      # 3. `--no-install-recommends`. The recommended set pulls in a large tree
      #    that a software rasterizer does not need.
      #
      # `vulkan-tools` is not installed. It was there only for `vulkaninfo`, and
      # the adapter name is already in the log: `frame_cost` and `debug_draw`
      # both print the device with their measurements, and both run with
      # --nocapture in the recording step below. If those two stop printing it,
      # the adapter name leaves the log with them — a tradeoff made deliberately
      # rather than by accident.
      - name: Install a software Vulkan adapter
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          install() {
            sudo apt-get -o DPkg::Lock::Timeout=120 install -y -q \
              --no-install-recommends mesa-vulkan-drivers
          }

          # The fast path: the image's package lists are usually fresh enough.
          if install; then
            echo "installed from the image's existing package lists"
          else
            echo "install failed; refreshing package lists and retrying"
            sudo apt-get -o DPkg::Lock::Timeout=120 update -q
            install
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Test
        # A missing adapter fails rather than skips. Renderer tests skip when
        # there is no GPU so a bare container stays usable, and cargo swallows a
        # passing test's output — which made a green run indistinguishable from
        # one that rendered nothing at all.
        env:
          CX_REQUIRE_GPU: '1'
        run: cargo test --workspace

      # Numbers that are recorded rather than gated — frame cost, debug-draw
      # cost, adapter names — are printed by tests that pass, and cargo swallows
      # a passing test's output. Re-running them with --nocapture is what
      # actually puts them in the log; without this the "recording" records
      # nothing.
      #
      # Every test that prints a measurement must be listed here. `debug_draw`
      # was added to the suite with a measurement nobody would ever have seen,
      # which is the same trap this step exists to close.
      - name: Record hardware-dependent measurements
        env:
          CX_REQUIRE_GPU: '1'
        run: |
          cargo test -p cx-app --test frame_cost -- --nocapture
          cargo test -p cx-app --test debug_draw -- --nocapture
          cargo test -p cx-render --test draw_calls -- --nocapture

  # S21's graph diff annotates rather than blocking — a check that fails every
  # legitimate architecture change gets switched off within a month. The one
  # exception is ADR-0011's writer limit on ELEVATION, which `--strict` turns
  # into a failure, because a third writer is a defect rather than a change.
  #
  # The rendered page is uploaded so a reviewer can open the diagram from the
  # run rather than rebuilding it locally.
  architecture:
    name: architecture graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
      - name: Export and render
        run: |
          set -euo pipefail
          cargo run -q -p chromatron-cli -- graph --profile full-sim --out graph.json
          cargo run -q -p graph-viewer -- --graph graph.json --out graph.html --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-graph
          path: |
            graph.json
            graph.html

  # Gates-first: these compile and run only once their crate's feature is
  # switched on by the commit that implements it. The step is expected to be a
  # no-op until then, and is wired up now so that enabling a feature cannot
  # forget to enable its gate.
  gates:
    name: m0 gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
      - name: M0 benchmark gates
        run: |
          features=""
          for f in m0-ecs m0-fields m0-module; do
            if cargo check -p chromatron-bench --features "$f" --benches >/dev/null 2>&1; then
              features="${features:+$features,}$f"
            else
              echo "::notice::$f not yet implemented; its gate is skipped"
            fi
          done
          if [ -n "$features" ]; then
            cargo bench -p chromatron-bench --features "$features"
          else
            echo "no M0 gates enabled yet"
          fi
