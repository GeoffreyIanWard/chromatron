[package]
name = "cx-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Debug-draw vertices go straight to the GPU as bytes; the derive is what makes
# that a checked cast rather than a transmute.
bytemuck.workspace = true
# Directly, for the `Component` derive, which expands to `bevy_ecs::` paths.
bevy_ecs.workspace = true
cx-core.workspace = true
cx-ecs.workspace = true

# Below the firewall: the strict sim lint set does not apply here.
# See the workspace manifest and 03-conventions.md.
[lints.rust]
unsafe_code = "warn"
