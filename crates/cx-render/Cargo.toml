[package]
name = "cx-render"
description = "S12 renderer. The only crate permitted to depend on wgpu (ADR-0005, ADR-0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cx-core.workspace = true
cx-view.workspace = true
cx-ui.workspace = true

# The egui-to-wgpu bridge. It names devices, queues, and encoders, so it lives
# with the crate that owns wgpu rather than with the one that owns egui — see
# 02-architecture.md and tools/ci-checks.
egui-wgpu.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
raw-window-handle.workspace = true

# Below the firewall: the strict sim lint set does not apply here.
# See the workspace manifest and 03-conventions.md.
[lints.rust]
unsafe_code = "warn"
