[package]
name = "cx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cx-core.workspace = true
cx-ecs.workspace = true
cx-time.workspace = true
cx-render.workspace = true
cx-view.workspace = true
cx-ui.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The windowing library. 02-architecture.md gives it exactly one home, the same
# way wgpu lives only in cx-render; tools/ci-checks enforces both.
winit.workspace = true

# Below the firewall: the strict sim lint set does not apply here.
# See the workspace manifest and 03-conventions.md.
[dev-dependencies]
cx-time.workspace = true
# Above the firewall, used only by tests: the determinism harness is what the
# M1 state-equivalence criteria are checked with.
cx-diag.workspace = true

[lints.rust]
unsafe_code = "warn"
