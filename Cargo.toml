[workspace]
resolver = "3"
members = [
    # ---- sim side: nothing here may depend on anything below the firewall ----
    "crates/cx-core",
    "crates/cx-module",
    "crates/cx-ecs",
    "crates/cx-time",
    "crates/cx-fields",
    "crates/cx-worldgen",
    "crates/cx-edit",
    "crates/cx-solvers",
    "crates/cx-spatial",
    "crates/cx-agents",
    "crates/cx-physics",
    "crates/cx-lod",
    "crates/cx-data",
    "crates/cx-persist",
    "crates/cx-diag",
    "crates/cx-sim",
    # ---- firewall ----
    "crates/cx-render",
    "crates/cx-view",
    "crates/cx-present",
    "crates/cx-audio",
    "crates/cx-ui",
    "crates/cx-app",
    # ---- binaries ----
    "apps/chromatron-game",
    "apps/chromatron-cli",
    "apps/chromatron-bench",
    # ---- repo tooling ----
    "tools/ci-checks",
    "tools/graph-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Sim-side. Versions are exact, not caret: ADR-0004 makes the build part of the
# determinism contract, so a patch bump is a deliberate task with a re-verify.
bevy_ecs = "=0.19.1"
bevy_tasks = "=0.19.1"
glam = "=0.33.3"
thiserror = "=2.0.20"
tracing = "=0.1.44"
indexmap = "=2.14.0"
toml = "=1.1.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Apps and tooling only.
anyhow = "=1.0.100"
clap = { version = "=4.5.52", features = ["derive"] }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
criterion = "=0.7.0"
cargo_metadata = "=0.23.0"

# Presentation side. Exact pins for the same reason as everything else: a bump
# is a deliberate task. `wgpu` may only be a direct dependency of `cx-render`
# (ADR-0005, ADR-0010) — enforced by tools/ci-checks.
wgpu = "=30.0.0"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
# The interop boundary between the renderer and the windowing library: cx-render
# names these traits, cx-app supplies a winit window that implements them, and
# neither crate learns about the other.
raw-window-handle = "=0.6.2"
winit = "=0.30.13"

# The debug overlay (S14/S16). Split across two crates on purpose: `egui` is the
# UI itself and lives in cx-ui, `egui-wgpu` names wgpu types and therefore lives
# with cx-render. tools/ci-checks enforces both.
egui = "=0.36.1"
egui-wgpu = "=0.36.1"

# Internal.
cx-core = { path = "crates/cx-core" }
cx-module = { path = "crates/cx-module" }
cx-ecs = { path = "crates/cx-ecs" }
cx-time = { path = "crates/cx-time" }
cx-fields = { path = "crates/cx-fields" }
cx-worldgen = { path = "crates/cx-worldgen" }
cx-edit = { path = "crates/cx-edit" }
cx-solvers = { path = "crates/cx-solvers" }
cx-spatial = { path = "crates/cx-spatial" }
cx-agents = { path = "crates/cx-agents" }
cx-physics = { path = "crates/cx-physics" }
cx-lod = { path = "crates/cx-lod" }
cx-data = { path = "crates/cx-data" }
cx-persist = { path = "crates/cx-persist" }
cx-diag = { path = "crates/cx-diag" }
cx-sim = { path = "crates/cx-sim" }
cx-render = { path = "crates/cx-render" }
cx-view = { path = "crates/cx-view" }
cx-present = { path = "crates/cx-present" }
cx-audio = { path = "crates/cx-audio" }
cx-ui = { path = "crates/cx-ui" }
cx-app = { path = "crates/cx-app" }

# Opted into by sim crates via `[lints] workspace = true`. Crates below the
# firewall and under apps/ deliberately do not opt in: panicking is fine in
# tools, tests, and benchmarks (03-conventions.md).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
float_cmp = "deny"
# Determinism: no unordered iteration in sim code (ADR-0004). The types
# themselves are named in clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Benchmarks and determinism checks are meaningless on an unoptimized build,
# and M0 asks for both constantly.
[profile.dev.package."*"]
opt-level = 3

# Our own crates, when running tests. Worldgen's tests operate on a whole block
# — 26 million cells, and erosion sweeps it a dozen times — which at `opt-level
# = 0` does not finish in any time worth waiting for. CI's `cargo test` went
# from 5 minutes to 23 as the block-scale tests landed, and erosion would have
# taken it past the job timeout.
#
# `2` rather than `3`: it recovers essentially all of the speed and keeps
# compile times and debuginfo quality closer to a debug build, which is what the
# rest of the workspace's tests want.
[profile.test]
opt-level = 2

[profile.bench]
lto = "thin"
codegen-units = 1
